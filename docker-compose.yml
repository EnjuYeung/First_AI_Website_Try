services:
  app:
    restart: always
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    image: first_ai_website_try:latest
    container_name: subm
    ports:
      - "127.0.0.1:33001:3001"
    env_file:
      - /opt/1panel/apps/First_AI_Website_Try/.env
    volumes:
      - /opt/1panel/apps/First_AI_Website_Try/Jan:/app/server/data
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
